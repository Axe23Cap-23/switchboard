<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Switchboard</title>
<style>
  :root {
    --bg: #14140f;
    --panel: #1c1c15;
    --line: #33332a;
    --text: #e8e6db;
    --muted: #8c8a7a;
    --amber: #d9a441;
    --blue: #5b8fd9;
    --green: #6ab97a;
    --red: #d9615b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 14px;
  }
  header {
    max-width: 760px;
    margin: 0 auto 32px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.02em;
  }
  #updated {
    color: var(--muted);
    font-size: 12px;
  }
  main { max-width: 760px; margin: 0 auto; }
  .task {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .task-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .bot-name { font-weight: 500; }
  .status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: lowercase;
    white-space: nowrap;
  }
  .status.pending { color: var(--amber); border: 1px solid var(--amber); }
  .status.in_progress { color: var(--blue); border: 1px solid var(--blue); }
  .status.done { color: var(--green); border: 1px solid var(--green); }
  .status.error { color: var(--red); border: 1px solid var(--red); }
  .input, .output {
    margin-top: 10px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .label { color: var(--muted); font-size: 11px; margin-top: 10px; margin-bottom: 2px; }
  .children {
    margin-top: 12px;
    padding-left: 18px;
    border-left: 1px solid var(--line);
  }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
</style>
</head>
<body>
<header>
  <h1>Switchboard</h1>
  <span id="updated">—</span>
</header>
<main id="tasks">
  <div class="empty">Waiting for the first task...</div>
</main>

<script>
function renderTask(t) {
  const div = document.createElement('div');
  div.className = 'task';

  const head = document.createElement('div');
  head.className = 'task-head';
  head.innerHTML = `<span class="bot-name">${t.bot}</span><span class="status ${t.status}">${t.status}</span>`;
  div.appendChild(head);

  const inputLabel = document.createElement('div');
  inputLabel.className = 'label';
  inputLabel.textContent = 'input';
  div.appendChild(inputLabel);

  const input = document.createElement('div');
  input.className = 'input';
  input.textContent = t.input;
  div.appendChild(input);

  if (t.output) {
    const outputLabel = document.createElement('div');
    outputLabel.className = 'label';
    outputLabel.textContent = 'output';
    div.appendChild(outputLabel);

    const output = document.createElement('div');
    output.className = 'output';
    output.textContent = t.output;
    div.appendChild(output);
  }

  if (t.children && t.children.length) {
    const childWrap = document.createElement('div');
    childWrap.className = 'children';
    t.children.forEach(c => childWrap.appendChild(renderTask(c)));
    div.appendChild(childWrap);
  }

  return div;
}

async function refresh() {
  try {
    const res = await fetch('/api/tasks');
    const tasks = await res.json();
    const container = document.getElementById('tasks');
    container.innerHTML = '';
    if (!tasks.length) {
      container.innerHTML = '<div class="empty">Waiting for the first task...</div>';
    } else {
      tasks.forEach(t => container.appendChild(renderTask(t)));
    }
    document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('updated').textContent = 'connection lost';
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
